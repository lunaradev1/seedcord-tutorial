allowBuilds:
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
ignoreWorkspaceRootCheck: true
overrides:
  vite@*: 'catalog:'
patchedDependencies:
  starlight-cooler-credit: patches/starlight-cooler-credit.patch
  starlight-group-pages: patches/starlight-group-pages.patch
  starlight-kbd: patches/starlight-kbd.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
permissions:
  starlight-codeblocks:
    skills: true
  taze:
    skills: true
skills:
  dirs:
    - .agents/skills
